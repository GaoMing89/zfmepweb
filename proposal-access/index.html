<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>MEP 机电专属提案｜ZEFENG MEP</title>
    <link rel="stylesheet" href="/proposal-access/access.css?v=20260818-visual-v2" />
  </head>
  <body>
    <main class="access-shell">
      <section class="access-visual" aria-hidden="true">
        <div class="brand">ZEFENG MEP <span>HIGH-END RESIDENTIAL SYSTEMS</span></div>
        <div class="visual-copy">
          <p>A PRIVATE CONSIDERATION</p>
          <h1>一席居所，<br />自有它的呼吸与分寸</h1>
          <span>愿这份提案，为理想生活多添一份从容</span>
        </div>
      </section>

      <section class="access-panel">
        <div class="access-card">
          <p class="eyebrow">VIP · Private Client Access</p>
          <h2>欢迎阅览您的<br />MEP 机电专属提案</h2>
          <p class="lead">这份 MEP 机电专属提案已由泽丰项目顾问为您悉心准备。烦请输入专属密钥，随后即可安心阅览。</p>
          <form id="access-form">
            <label for="access-code">您的专属密钥</label>
            <input id="access-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="请输入顾问为您准备的密钥" required />
            <button type="submit">开启专属提案</button>
            <p id="access-error" class="error" role="alert" aria-live="polite"></p>
          </form>
          <div class="privacy-note">
            <strong>安心阅览</strong>
            <span>您的访问密钥仅在约定期限内有效。如需任何协助，项目顾问将随时为您服务。</span>
          </div>
          <a class="back" href="/">← 返回泽丰官网</a>
          <a class="admin-entry" href="/login/index.html?next=proposals" title="进入泽丰提案管理中心">泽丰团队入口</a>
        </div>
      </section>
    </main>
    <script src="/proposal-access/access-managed-v1.js?v=20260818-copy-v2" defer></script>
  </body>
</html>
