<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>专属提案访问｜泽丰住宅机电系统</title>
    <link rel="stylesheet" href="/proposal-access/access-entry-v2.css?v=20260818-unified-v2" />
  </head>
  <body>
    <div class="proposal-page">
      <img class="architectural-art" src="/proposal-access/access-system-sketch.png?v=20260818-unified-v1" alt="" fetchpriority="high" />

      <header class="site-header">
        <a class="brand" href="/" aria-label="返回泽丰官网">
          <img src="/images/zefeng-logo-mark.webp" alt="" />
          <span><strong>泽丰住宅机电系统</strong><small>PRIVATE PROPOSAL</small></span>
        </a>
        <nav class="header-actions" aria-label="提案入口导航">
          <a href="/proposal-admin-login/">提案管理</a>
          <a href="/">返回首页 <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <main class="proposal-main">
        <section class="access-card" aria-labelledby="proposal-access-title">
          <p class="eyebrow">A Private Consideration</p>
          <h1 id="proposal-access-title">一席居所，<br />自有它的呼吸与分寸</h1>
          <p class="intro">愿这份为住宅悉心准备的提案，为理想生活多添一份从容。</p>

          <form id="access-form">
            <label for="access-code">访问密钥</label>
            <div class="access-action">
              <input id="access-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="请输入项目顾问发送的密钥" required />
              <button type="submit">打开提案 <span aria-hidden="true">→</span></button>
            </div>
            <p id="access-error" class="error" role="alert" aria-live="polite"></p>
          </form>

          <div class="access-detail">
            <span>仅限授权访问</span>
            <p>密钥在约定期限内有效，到期或撤销后将停止访问。</p>
          </div>

          <div class="system-scope" aria-label="泽丰住宅机电专业范围">
            <span>给排水系统</span><i aria-hidden="true"></i><span>地下室专项</span><i aria-hidden="true"></i><span>室内空气环境</span>
          </div>
        </section>
      </main>
    </div>
    <script src="/proposal-access/access-managed-v1.js?v=20260818-unified-v1" defer></script>
  </body>
</html>
