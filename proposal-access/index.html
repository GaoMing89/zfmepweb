<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>专属提案访问｜ZEFENG MEP</title>
    <link rel="stylesheet" href="/proposal-access/access.css" />
  </head>
  <body>
    <main class="access-shell">
      <section class="access-visual" aria-hidden="true">
        <div class="brand">ZEFENG MEP <span>HIGH-END RESIDENTIAL SYSTEMS</span></div>
        <div class="visual-copy">
          <p>PRIVATE PROPOSAL</p>
          <h1>为这个家建立的<br />专属空气环境提案</h1>
          <span>内容仅在授权有效期内开放</span>
        </div>
      </section>

      <section class="access-panel">
        <div class="access-card">
          <p class="eyebrow">Client Access</p>
          <h2>查看专属提案</h2>
          <p class="lead">请输入泽丰项目顾问发送给您的访问密钥。</p>
          <form id="access-form">
            <label for="access-code">访问密钥</label>
            <input id="access-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="请输入完整访问密钥" required />
            <button type="submit">验证并查看提案</button>
            <p id="access-error" class="error" role="alert" aria-live="polite"></p>
          </form>
          <div class="privacy-note">
            <strong>专属资料保护</strong>
            <span>密钥具有有效期；到期或被撤销后将无法继续查看。请勿转发。</span>
          </div>
          <a class="back" href="/">← 返回泽丰官网</a>
          <a class="admin-entry" href="/login/index.html?next=proposals" title="进入泽丰提案管理中心"><span aria-hidden="true">⚙</span> 管理提案</a>
        </div>
      </section>
    </main>
    <script src="/proposal-access/access-managed-v1.js" defer></script>
  </body>
</html>
